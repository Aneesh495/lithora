[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lithora"
version = "0.1.0"
description = "Python inference, Euler-pole fitting, and deformation baselines for Lithora."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Aneesh" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
learn = ["torch>=2.1"]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
